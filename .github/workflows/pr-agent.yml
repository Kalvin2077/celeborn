name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' && startsWith(github.event.pull_request.head.ref, 'review-head/pr-') }}

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Review shadow PR
        uses: docker://pragent/pr-agent:0.41.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENAI_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI.API_BASE: ${{ vars.PR_AGENT_API_BASE }}

          config.model: ${{ vars.PR_AGENT_MODEL }}
          config.fallback_models: '[]'

          # Least privilege: never modify repository contents
          config.restricted_mode: "true"

          # Temporarily verbose while we validate the setup
          config.verbosity_level: "2"

          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize"]'